name: retinascreen
description: >-
  RetinaScreen Phase 1 — companion and last-mile app for diabetic-retinopathy
  screening programs. Referral tracking, reminders, and plain-language result
  explanation. This app does NOT diagnose (keeps Phase 1 outside SaMD).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Localised Material widgets (date pickers, tooltips) for the languages the
  # app ships. The app's OWN strings are handled by lib/l10n/strings.dart — a
  # lightweight in-repo map, no codegen — so translations stay reviewable.
  flutter_localizations:
    sdk: flutter

  # App-lock secrets (PIN hash) kept in the platform keystore/keychain.
  flutter_secure_storage: ^9.2.2

  # App lock: PIN always available; biometric when the device + build support
  # it (needs FlutterFragmentActivity on Android — see docs/SECURITY.md).
  local_auth: ^2.3.0
  crypto: ^3.0.5

  # Non-secret preferences (chosen language, whether the lock is enabled).
  shared_preferences: ^2.3.2

  # State management — the provider layer is the contract between the data
  # layer (Person A) and the screens (Person B). See providers/app_providers.dart.
  flutter_riverpod: ^2.5.1

  # Offline-first source of truth. Drift = typed SQLite with reactive streams.
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Local follow-up reminders (A15/A16). Timezone-aware scheduling.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Launch maps + dialer for referral sites / patient phone (A18).
  url_launcher: ^6.3.0

  # Formatting (dates in the UI). No network, no PII leaves the device.
  # Pinned to 0.20.x to match the version flutter_localizations requires.
  intl: ^0.20.2

  # Screening report generation + printing. The PDF is built ON-DEVICE from
  # data already on the phone; nothing is uploaded. `printing` hands the bytes
  # to the OS share sheet / printer — PII only leaves if the health worker
  # chooses to send it (consistent with the offline-first / DPDP posture).
  pdf: ^3.11.1
  printing: ^5.13.1

  # Program-data export (CSV) via the system share sheet, and a temp-file path
  # to hand the export to it. Same posture: the user chooses the destination.
  # Upper-bounded below 10.3.0, where Share.shareXFiles was deprecated — keeps
  # `flutter analyze` clean without adopting the newer ShareParams API.
  share_plus: '>=10.0.0 <10.3.0'
  path_provider: ^2.1.4

  # On-device diabetic-retinopathy grading (decision support). Inference runs
  # locally via TFLite so the fundus image never leaves the phone. The grader
  # only SUGGESTS a grade — a human confirms it. See services/retinopathy_grader.dart.
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  image_picker: ^1.1.2

  # Scannable referral hand-off. Pure-Dart QR rendering on screen; the report
  # PDF uses the pdf package's own barcode support (no extra native code).
  qr_flutter: ^4.1.0

  # Spoken result read-out for low-literacy patients, in their language.
  flutter_tts: ^4.0.2

  # On-device LLM assistant (Gemma-3 1B via MediaPipe LiteRT). The model is
  # downloaded on demand (~550 MB); until then the app uses the offline
  # TemplateAssistant, so this never blocks first run. See docs/LLM_ASSISTANT.md.
  # Native ML plugin — validate the Gradle build on a real device.
  flutter_gemma: ^1.5.9
  # Versioned independently of flutter_gemma (its LiteRT engine companion).
  flutter_gemma_litertlm: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen for Drift tables -> lib/data/database.g.dart
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

  flutter_lints: ^4.0.0

  # App icon + splash generators. Run once after `flutter pub get`:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # The on-device DR model. Drop a converted .tflite here as `dr_model.tflite`
  # (see assets/models/README.md). The folder is declared so the model is
  # bundled once present; until then the AI assist degrades gracefully.
  assets:
    - assets/models/

# --- App icon (run: dart run flutter_launcher_icons) ---
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

# --- Splash screen (run: dart run flutter_native_splash:create) ---
flutter_native_splash:
  color: "#00695C"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#00695C"
    image: assets/icon/splash_logo.png
